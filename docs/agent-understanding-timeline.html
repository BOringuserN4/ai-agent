<!doctype html>
<meta charset="utf-8" />

<title>对 Agent 的理解 · 演进时间线</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--fg:#172033;--muted:#5b6475;--line:#64748b;
--neutral:#e2e8f0;--mine:#fde68a;--fix:#bfdbfe;--flip:#fecaca;}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e5e7eb;--muted:#a3adbd;--line:#94a3b8;
--neutral:#334155;--mine:#92400e;--fix:#1d4ed8;--flip:#991b1b;}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
main{max-width:1320px;margin:28px auto;padding:0 18px;}
svg{width:100%;height:auto;display:block;}
.title{font-size:21px;font-weight:700;fill:var(--fg);}
.subtitle{font-size:13px;fill:var(--muted);}
.ts{font-size:13px;font-weight:700;fill:var(--muted);}
.dot{fill:var(--line);}
.node{stroke:var(--line);stroke-width:1;}
.neutral{fill:var(--neutral);}
.add{fill:var(--mine);}
.chg{fill:var(--fix);}
.flp{fill:var(--flip);}
.fix{fill:var(--fix);}
.flip{fill:var(--flip);}
.body{font-size:12.5px;fill:var(--fg);}
.fix{font-size:12.5px;font-weight:600;fill:var(--fg);}
.tag{font-size:11px;font-weight:700;fill:var(--muted);}
.small{font-size:12px;fill:var(--muted);}
.mk{fill:var(--bg);stroke:var(--line);stroke-width:1;opacity:.92;}
.mklabel{font-size:11px;font-weight:700;fill:var(--fg);}
.edge{stroke:var(--line);stroke-width:1.5;fill:none;}
.spine{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:2 6;opacity:.7;}

<main>
<svg viewBox="0 0 1726 1726" role="img" aria-label="对 Agent 的理解演进时间线">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker>
</defs>
<text class="title" x="30" y="44">对 Agent 的理解 · 演进时间线</text>
<text class="subtitle" x="30" y="70">左：你自己发表的理解　　右：纠偏回来　　　（时间：2026/09/12 → 09/15）</text>
<path class="spine" d="M 300 96 L 300 1696" />
<text class="ts" x="286" y="184.5" text-anchor="end">09-12</text>
<circle cx="300" cy="180.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="110" width="258" height="141" rx="10" />
<text class="tag" x="42" y="139">我的理解</text>
<text class="body" x="42" y="161">Agent = LLM </text>
<text class="body" x="42" y="180">的扩展。LLM 只会语言</text>
<text class="body" x="42" y="199">对话（像密米尔只出主意）</text>
<text class="body" x="42" y="218">，Agent 让它能做事</text>
<text class="body" x="42" y="237">。</text>
<path class="edge" d="M 294 180.5 L 356 180.5" marker-end="url(#ar)" />
<rect class="node add" x="366" y="110" width="884" height="141" rx="10" />
<rect class="mk" x="1172" y="119" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="134" text-anchor="middle">补充</text>
<text class="tag" x="378" y="139">纠偏</text>
<text class="body" x="378" y="161">主干正确。但漏了「回路」——不是「有工具」，而是工具结果要回流进上下文，驱动下一步。</text>
<text class="body" x="378" y="180">记忆让 LLM 跨「会话」不失忆；循环让 LLM 跨「步骤」不闭眼。两件事，别混。</text>
<text class="ts" x="286" y="347.5" text-anchor="end">09-12</text>
<circle cx="300" cy="343.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="273" width="258" height="141" rx="10" />
<text class="tag" x="42" y="302">我的理解</text>
<text class="body" x="42" y="324">记忆 = 外置上下文库（</text>
<text class="body" x="42" y="343">短期/长期/skill/</text>
<text class="body" x="42" y="362">经验），本质都是 </text>
<text class="body" x="42" y="381">prompt 工程的一部</text>
<text class="body" x="42" y="400">分。</text>
<path class="edge" d="M 294 343.5 L 356 343.5" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="273" width="884" height="141" rx="10" />
<rect class="mk" x="1172" y="282" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="297" text-anchor="middle">修正</text>
<text class="tag" x="378" y="302">纠偏</text>
<text class="body" x="378" y="324">核心判断对且重要：记忆 = 按需供给的上下文库。</text>
<text class="body" x="378" y="343">但「都算 prompt 工程」太宽——它其实是独立的「上下文工程」，横切所有层。</text>
<text class="ts" x="286" y="482.0" text-anchor="end">09-12</text>
<circle cx="300" cy="478.0" r="6" class="dot" />
<rect class="node neutral" x="30" y="436" width="258" height="84" rx="10" />
<text class="tag" x="42" y="465">我的理解</text>
<text class="body" x="42" y="487">评估 = agent 自</text>
<text class="body" x="42" y="506">我更新优化的过程。</text>
<path class="edge" d="M 294 478.0 L 356 478.0" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="436" width="884" height="84" rx="10" />
<rect class="mk" x="1172" y="445" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="460" text-anchor="middle">修正</text>
<text class="tag" x="378" y="465">纠偏</text>
<text class="body" x="378" y="487">说重了。评估只「产信号」（哪个 prompt/编排更好），优化是另一件事。</text>
<text class="body" x="378" y="506">生产里多数仍需人在环内（human-in-the-loop）；「自我进化」目前基本是研究向。</text>
<text class="ts" x="286" y="607.0" text-anchor="end">09-12</text>
<circle cx="300" cy="603.0" r="6" class="dot" />
<rect class="node neutral" x="30" y="542" width="258" height="122" rx="10" />
<text class="tag" x="42" y="571">我的理解</text>
<text class="body" x="42" y="593">编排 = </text>
<text class="body" x="42" y="612">multi-agent </text>
<text class="body" x="42" y="631">或子 agent 架构这</text>
<text class="body" x="42" y="650">些干的事。</text>
<path class="edge" d="M 294 603.0 L 356 603.0" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="542" width="884" height="122" rx="10" />
<rect class="mk" x="1172" y="551" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="566" text-anchor="middle">修正</text>
<text class="tag" x="378" y="571">纠偏</text>
<text class="body" x="378" y="593">划错了。单 Agent 的循环本身就是编排（哪步调哪个工具、何时停）。</text>
<text class="body" x="378" y="612">多 Agent 只是一种实现选择——而且是最好被滥用的一种。</text>
<text class="ts" x="286" y="741.5" text-anchor="end">09-12</text>
<circle cx="300" cy="737.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="686" width="258" height="103" rx="10" />
<text class="tag" x="42" y="715">我的理解</text>
<text class="body" x="42" y="737">复杂任务需要编排，简单任</text>
<text class="body" x="42" y="756">务编排是浪费。</text>
<path class="edge" d="M 294 737.5 L 356 737.5" marker-end="url(#ar)" />
<rect class="node add" x="366" y="686" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="695" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="710" text-anchor="middle">补充</text>
<text class="tag" x="378" y="715">纠偏</text>
<text class="body" x="378" y="737">方向对。但漏了两条更硬的代价：</text>
<text class="fix" x="378" y="756">① 流程定死 → 任务一旦偏离预设路径就卡住（需反思/重规划兜底）；</text>
<text class="fix" x="378" y="775">② 多 agent 交接要压缩上下文 → 一压缩就丢信息。</text>
<text class="ts" x="286" y="866.5" text-anchor="end">09-12</text>
<circle cx="300" cy="862.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="811" width="258" height="103" rx="10" />
<text class="tag" x="42" y="840">我的理解</text>
<text class="body" x="42" y="862">function </text>
<text class="body" x="42" y="881">call 一对一适配，效</text>
<text class="body" x="42" y="900">率太低，所以要 MCP。</text>
<path class="edge" d="M 294 862.5 L 356 862.5" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="811" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="820" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="835" text-anchor="middle">修正</text>
<text class="tag" x="378" y="840">纠偏</text>
<text class="body" x="378" y="862">低效的不是「调用」，是「复用」：N 框架 × M 工具 = N×M 份适配，MCP 压成 N+M。</text>
<text class="body" x="378" y="881">另外漏了另一半：工具「结果怎么格式化回流」也是协议工程的一部分。</text>
<text class="ts" x="286" y="991.5" text-anchor="end">09-12</text>
<circle cx="300" cy="987.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="936" width="258" height="103" rx="10" />
<text class="tag" x="42" y="965">我的理解</text>
<text class="body" x="42" y="987">监控是实时看内部发生了什</text>
<text class="body" x="42" y="1006">么；评测是有答案本对照打</text>
<text class="body" x="42" y="1025">分。观测让评分维度更多。</text>
<path class="edge" d="M 294 987.5 L 356 987.5" marker-end="url(#ar)" />
<rect class="node add" x="366" y="936" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="945" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="960" text-anchor="middle">补充</text>
<text class="tag" x="378" y="965">纠偏</text>
<text class="body" x="378" y="987">判断对——这是分水岭。但关联点说浅了：</text>
<text class="fix" x="378" y="1006">真正的关联是「监控供题、评测验收」：坏 case → 固化成评测题 → 修复 → 回归验证。</text>
<text class="ts" x="286" y="1116.5" text-anchor="end">09-12</text>
<circle cx="300" cy="1112.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="1061" width="258" height="103" rx="10" />
<text class="tag" x="42" y="1090">我的理解</text>
<text class="body" x="42" y="1112">multi-agent </text>
<text class="body" x="42" y="1131">多边协商是趋势（对等、去</text>
<text class="body" x="42" y="1150">中心才叫先进）。</text>
<path class="edge" d="M 294 1112.5 L 356 1112.5" marker-end="url(#ar)" />
<rect class="node flp" x="366" y="1061" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="1070" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="1085" text-anchor="middle">推翻</text>
<text class="tag" x="378" y="1090">纠偏</text>
<text class="body" x="378" y="1112">推翻。星状/主管结构更常见（一个主 agent 分发子 agent）。</text>
<text class="body" x="378" y="1131">关键不是「agent 数量」，是「结构」——数量根本不是变量。</text>
<text class="body" x="378" y="1150">默认：能用单 agent 就别上多 agent。</text>
<text class="ts" x="286" y="1232.0" text-anchor="end">09-14</text>
<circle cx="300" cy="1228.0" r="6" class="dot" />
<rect class="node neutral" x="30" y="1186" width="258" height="84" rx="10" />
<text class="tag" x="42" y="1215">我的理解</text>
<text class="body" x="42" y="1237">相关度决定是否命中；那阈</text>
<text class="body" x="42" y="1256">值到底定在多少？</text>
<path class="edge" d="M 294 1228.0 L 356 1228.0" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="1186" width="884" height="84" rx="10" />
<rect class="mk" x="1172" y="1195" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="1210" text-anchor="middle">修正</text>
<text class="tag" x="378" y="1215">纠偏</text>
<text class="body" x="378" y="1237">混淆了「算分」和「用分」：分数只负责测量，决定命中的是你设的阈值。</text>
<text class="body" x="378" y="1256">top_k 管排序（控 token 上限），阈值管资格（控质量下限）——两道闸门，缺一不可。</text>
<text class="ts" x="286" y="1347.5" text-anchor="end">09-14</text>
<circle cx="300" cy="1343.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="1292" width="258" height="103" rx="10" />
<text class="tag" x="42" y="1321">我的理解</text>
<text class="body" x="42" y="1343">Langfuse 我以为</text>
<text class="body" x="42" y="1362">是个看板。</text>
<path class="edge" d="M 294 1343.5 L 356 1343.5" marker-end="url(#ar)" />
<rect class="node chg" x="366" y="1292" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="1301" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="1316" text-anchor="middle">修正</text>
<text class="tag" x="378" y="1321">纠偏</text>
<text class="body" x="378" y="1343">是埋点/追踪系统。比日志强在结构化 + 父子层次 + 可量化。</text>
<text class="body" x="378" y="1362">关键：埋点是「你主动决定记什么」，没埋的就是盲区。</text>
<text class="fix" x="378" y="1381">「看不见」常常不是没上报，是没埋、或查错了表。</text>
<text class="ts" x="286" y="1472.5" text-anchor="end">09-15</text>
<circle cx="300" cy="1468.5" r="6" class="dot" />
<rect class="node neutral" x="30" y="1417" width="258" height="103" rx="10" />
<text class="tag" x="42" y="1446">我的理解</text>
<text class="body" x="42" y="1468">e6（算数 + 查天气）</text>
<text class="body" x="42" y="1487">满足「上下文隔离」，因为</text>
<text class="body" x="42" y="1506">跨域所以该拆成两个专家。</text>
<path class="edge" d="M 294 1468.5 L 356 1468.5" marker-end="url(#ar)" />
<rect class="node flp" x="366" y="1417" width="884" height="103" rx="10" />
<rect class="mk" x="1172" y="1426" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="1441" text-anchor="middle">推翻</text>
<text class="tag" x="378" y="1446">纠偏</text>
<text class="body" x="378" y="1468">一条判据都不满足。两个子任务各用一个独立工具，同处一个上下文不会互相干扰。</text>
<text class="body" x="378" y="1487">漏答的真因不是「跨域」，是调度把跨域当成了拆分判据、而专家各只有半个工具集。</text>
<text class="fix" x="378" y="1506">→ 「跨域」不是判据，「单 Agent 做不到」才是。</text>
<text class="ts" x="286" y="1607.0" text-anchor="end">09-15</text>
<circle cx="300" cy="1603.0" r="6" class="dot" />
<rect class="node neutral" x="30" y="1542" width="258" height="122" rx="10" />
<text class="tag" x="42" y="1571">我的理解</text>
<text class="body" x="42" y="1593">merge 花了 </text>
<text class="body" x="42" y="1612">token 但没新增内容</text>
<text class="body" x="42" y="1631">——我觉得它值得一个 </text>
<text class="body" x="42" y="1650">agent。</text>
<path class="edge" d="M 294 1603.0 L 356 1603.0" marker-end="url(#ar)" />
<rect class="node flp" x="366" y="1542" width="884" height="122" rx="10" />
<rect class="mk" x="1172" y="1551" width="66" height="21" rx="10" />
<text class="mklabel" x="1205" y="1566" text-anchor="middle">推翻</text>
<text class="tag" x="378" y="1571">纠偏</text>
<text class="body" x="378" y="1593">问法要改：不是「merge 值不值」，是「这个结构值不值」。</text>
<text class="body" x="378" y="1612">实测同一道题：拆 2 专家 3624 token vs 判「不拆」2242 token，质量一样。</text>
<text class="body" x="378" y="1631">归并员是被「拆」连累的——拆了就必须粘回去，粘回去就得再付一份钱。</text>
<rect class="node add" x="30" y="1697" width="14" height="14" rx="3"/>
<text class="small" x="52" y="1708">补充（漏掉的）</text>
<rect class="node chg" x="180" y="1697" width="14" height="14" rx="3"/>
<text class="small" x="202" y="1708">修正（说偏了）</text>
<rect class="node flp" x="330" y="1697" width="14" height="14" rx="3"/>
<text class="small" x="352" y="1708">推翻（说反了）</text>
</svg>
</main>
